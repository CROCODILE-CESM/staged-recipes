schema_version: 1

context:
  version: "0.1.3"
  python_min: "3.11"

package:
  name: visualcasegen
  version: ${{ version }}

source:
  url: https://github.com/ESMCI/visualCaseGen/archive/refs/tags/main_1.0.0.tar.gz
  sha256: 7d18ba7d5059bc3f3fa618cc3e859b688f0cb51dcab022931652c2ebaa15d3b8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >=${{ python_min }},<3.12
    - ipykernel >=6.29,<6.30
    - ipython >=8.2,<8.3
    - jupyterlab >=4.0,<4.1
    - jupyterlab_server >=2.25,<2.26
    - ipywidgets >=8.1.1,<8.2
    - pyyaml >=6.0,<6.1
    - z3-solver >=4.12.3,<4.13
    - networkx >=3.3,<3.4
    - netcdf4 >=1.6,<1.7
    - xarray >=2023.12,<2024
    - ipyfilechooser
    - mom6_forge

tests:
  - python:
      imports:
        - visualCaseGen
        - ProConPy
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - pytest tests/1_unit/
    requirements:
      run:
        - pytest
    files:
      source:
        - tests/1_unit/

about:
  summary: A GUI to guide CESM users when creating a new case
  license: Apache-2.0
  license_file: LICENSE.md
  homepage: https://github.com/ESMCI/visualCaseGen

extra:
  recipe-maintainers:
    - alperaltuntas
    - manishvenu
